[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pitchlake"
version = "1.0.0"
description = "Metadata-driven medallion framework for integrating StatsBomb event data into a Microsoft Fabric lakehouse"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Paul Martin" }]
dependencies = [
  "requests>=2.31",
  "pyarrow>=14",
  "deltalake>=0.22",
  "duckdb>=1.1",
  "pyyaml>=6",
  "rapidfuzz>=3",
]

[project.optional-dependencies]
app = ["streamlit>=1.35", "mplsoccer>=1.2", "matplotlib>=3.8", "pandas>=2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "pandas>=2"]

[project.scripts]
pitchlake = "pitchlake.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pitchlake"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "B905", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the public StatsBomb open-data endpoint (deselect with -m 'not live')"]
addopts = "-q -m 'not live'"
